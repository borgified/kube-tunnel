[package]
name = "kube-tunnel"
version = "0.1.0"
edition = "2021"
description = "A multi-cloud private Kubernetes tunneling CLI using native CSP tools"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "signal", "time"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
which = "7.0"
